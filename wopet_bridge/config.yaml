name: Wopet Feeder Bridge
version: "0.5.7"
slug: wopet_feeder_bridge
description: Local video, feeding and schedule control for the WOPET Camera Pet Feeder, with no cloud (fork of DrDronez/ha-wopet-local)
url: https://github.com/mnestor/ha-wopet-feeder
arch:
  - amd64
startup: services
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 1985
host_network: true
panel_icon: mdi:cctv
panel_title: Wopet Feeder
options:
  camera_ip: ""
  device_uid: ""
  device_username: ""
  device_password: ""
  stream_name: wopet
  rtsp_port: 8554
  control_port: 1986
  control_token: ""
  enable_audio: false
  preload_stream: true
  p2p_responder: true
  p2p_region_address: auto
  log_level: info
schema:
  camera_ip: str
  device_uid: password
  device_username: password
  device_password: password
  stream_name: match(^[A-Za-z0-9_-]+$)
  rtsp_port: port
  control_port: port
  control_token: password
  enable_audio: bool
  preload_stream: bool?
  p2p_responder: bool
  p2p_region_address: match(^(auto|captured|[0-9]{1,3}(\.[0-9]{1,3}){3})$)
  log_level: list(debug|info|warning|error)
